name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Unit, integration, acceptance and Part-3 reports
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      MONGO_URL: mongodb://127.0.0.1:27017/vps_part3_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            tests/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked JavaScript dependencies and PDF renderer
        run: |
          npm ci --prefix backend
          npm ci --prefix tests
          npm ci --prefix frontend
          python -m pip install -r scripts/report-requirements.txt
      - name: Execute tests and capture evidence
        run: node scripts/verify-part3.cjs --disposable-db
      - name: Generate reports and current traceability matrix
        if: always()
        run: python scripts/generate-part3-reports.py
      - name: Upload reports and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part3-testing-deliverables
          path: docs/
          if-no-files-found: error
