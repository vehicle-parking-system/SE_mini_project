# Checks that need a deployed environment, so they run nightly and on demand rather than on every push:
#   TC-Perf-01 / TC-Perf-02 (JMeter), TC-Sec-02 (testssl.sh), OWASP ZAP baseline scan.
# Configure in Settings → Secrets and variables → Actions:
#   variables: STAGING_URL, PERF_GATE_IN, PERF_GATE_OUT, PERF_BASELINE_USERS (default 100)
#   secrets:   PERF_ATTENDANT_EMAIL, PERF_ATTENDANT_PASSWORD, PAYMENT_WEBHOOK_SECRET
name: Nightly performance & security

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:
    inputs:
      target_url:
        description: "Deployed base URL (defaults to the STAGING_URL variable)"
        required: false
      duration:
        description: "Seconds per load test"
        default: "600"

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.t.outputs.url }}
    steps:
      - id: t
        env:
          URL: ${{ inputs.target_url || vars.STAGING_URL }}
        run: |
          if [ -z "$URL" ]; then echo "::notice::No STAGING_URL set — nothing deployed to test yet"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  performance:
    name: TC-Perf-01 / TC-Perf-02 (JMeter)
    needs: target
    if: needs.target.outputs.url != ''
    runs-on: ubuntu-latest
    env:
      JMETER_VERSION: 5.6.3
      BASELINE: ${{ vars.PERF_BASELINE_USERS || '100' }}
      DURATION: ${{ inputs.duration || '600' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install JMeter
        run: |
          f="apache-jmeter-${JMETER_VERSION}.tgz"
          curl -sSfL --max-time 300 -o "$f" "https://archive.apache.org/dist/jmeter/binaries/$f" \
            || curl -sSfL --max-time 300 -o "$f" "https://dlcdn.apache.org/jmeter/binaries/$f"
          tar xzf "$f"
          echo "$PWD/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Run load tests
        env:
          URL: ${{ needs.target.outputs.url }}
          ATTENDANT_EMAIL: ${{ secrets.PERF_ATTENDANT_EMAIL }}
          ATTENDANT_PASSWORD: ${{ secrets.PERF_ATTENDANT_PASSWORD }}
          WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
        run: |
          proto="${URL%%://*}"; hostport="${URL#*://}"; hostport="${hostport%%/*}"
          host="${hostport%%:*}"; port="${hostport##*:}"
          [ "$port" = "$hostport" ] && port=$([ "$proto" = https ] && echo 443 || echo 80)
          run() { # $1 = users, $2 = results file
            jmeter -n -t tests/performance/vps-load.jmx -l "$2" \
              -Jprotocol="$proto" -Jhost="$host" -Jport="$port" -Jusers="$1" -Jrampup=60 -Jduration="$DURATION" \
              -JgateIn="${{ vars.PERF_GATE_IN }}" -JgateOut="${{ vars.PERF_GATE_OUT }}" \
              -JattendantEmail="$ATTENDANT_EMAIL" -JattendantPassword="$ATTENDANT_PASSWORD" -JwebhookSecret="$WEBHOOK_SECRET" \
              -Jjmeter.save.saveservice.output_format=csv -Jjmeter.save.saveservice.response_message=false
          }
          status=0
          run "$BASELINE" perf01.jtl
          node tests/performance/check-results.js perf01.jtl perf01 || status=1
          run "$((BASELINE * 10))" perf02.jtl
          node tests/performance/check-results.js perf02.jtl perf02 || status=1
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jmeter-results, path: "*.jtl", if-no-files-found: ignore }

  tls:
    name: TC-Sec-02 TLS 1.2+ (testssl.sh)
    needs: target
    if: needs.target.outputs.url != '' && startsWith(needs.target.outputs.url, 'https://')
    runs-on: ubuntu-latest
    steps:
      - name: Scan protocols
        env:
          URL: ${{ needs.target.outputs.url }}
        run: |
          docker run --rm -v "$PWD:/out" drwetter/testssl.sh:3.2 --protocols --quiet --jsonfile /out/tls.json "$URL" || true
          offered=$(jq -r '.[] | select(.id=="SSLv2" or .id=="SSLv3" or .id=="TLS1" or .id=="TLS1_1")
                          | select(.finding | test("not offered") | not) | .id' tls.json)
          echo "### TC-Sec-02 (VPS-SR-001)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$offered" ]; then
            echo "❌ Protocols below TLS 1.2 offered: $offered" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          http_url="http://${URL#https://}"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$http_url" || true)
          location=$(curl -sI "$http_url" | grep -i '^location:' || true)
          if [[ ! "$code" =~ ^30[1278]$ ]] || [[ ! "$location" =~ https:// ]]; then
            echo "❌ Plain HTTP is not redirected to HTTPS (status $code)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "✅ Only TLS 1.2+ offered; HTTP redirects to HTTPS" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: testssl-report, path: tls.json, if-no-files-found: ignore }

  zap:
    name: OWASP ZAP baseline scan
    needs: target
    if: needs.target.outputs.url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ needs.target.outputs.url }}
          allow_issue_writing: false
